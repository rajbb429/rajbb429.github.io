<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join my Fart Together room</title>
<meta property="og:title" content="Join my Fart Together room!">
<meta property="og:description" content="Tap to hop on the raft. Hippos, rivers, and a lot of farting.">
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #7fd0f2; font-family: system-ui, sans-serif; color: #2b2638; }
  .card { background: #fff8ec; border: 4px solid #2b2638; border-radius: 24px; padding: 28px 22px; margin: 16px; max-width: 420px; text-align: center; box-shadow: 0 8px 0 #2b2638; }
  h1 { margin: 0 0 8px; font-size: 26px; }
  .code { font-size: 44px; letter-spacing: 10px; font-weight: 800; margin: 12px 0 18px; }
  a.btn { display: block; padding: 16px; margin: 10px 0; border-radius: 16px; border: 3px solid #2b2638; font-weight: 800; font-size: 18px; text-decoration: none; color: #2b2638; }
  .play { background: #f5d23c; }
  .store { background: #a6e83a; }
  p { margin: 6px 0; line-height: 1.4; }
</style>
</head>
<body>
<div class="card">
  <h1>🦛💨 You're invited!</h1>
  <p>Join my room in <b>Fart Together</b></p>
  <div class="code" id="code">····</div>
  <a class="btn play" id="open" href="#">OPEN IN THE GAME</a>
  <a class="btn store" href="https://play.google.com/store/apps/details?id=com.fartogether.game">GET THE GAME</a>
  <p>No luck opening it? Open Fart Together, tap <b>JOIN</b> and type the code.</p>
</div>
<script>
  var c = (new URLSearchParams(location.search).get("c") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
  if (c) document.getElementById("code").textContent = c;
  var store = "https://play.google.com/store/apps/details?id=com.fartogether.game";
  // Android: open the game straight into the room, or the Play Store if it isn't installed.
  var link = "intent://join/" + c + "#Intent;scheme=farttogether;package=com.fartogether.game;S.browser_fallback_url=" + encodeURIComponent(store) + ";end";
  var open = document.getElementById("open");
  open.href = /Android/i.test(navigator.userAgent) ? link : store;
  if (c && /Android/i.test(navigator.userAgent)) setTimeout(function () { location.href = link; }, 300);
</script>
</body>
</html>
